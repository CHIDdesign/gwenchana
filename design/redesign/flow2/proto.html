<title>사고 뒤 화면 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@300..800&display=swap">
<style>
/* 레이아웃: 바깥은 조용한 비교대, 안쪽은 Theme.kt 토큰을 그대로 쓴 실제 크기 화면(라이트) */
:root{--page:#ECEDF1;--page-fg:#131417;--page-sub:#55575F;--page-card:#F7F8FA;--page-line:rgba(19,20,23,.12);
--ink:#131417;--sec:#44464E;--ter:#686A72;--bg:#F7F8FA;--card:#FFFFFF;--line:rgba(19,20,23,.10);--basic:rgba(19,20,23,.05);--filled:#44464E;--red:#D32016;--night:#17181C;--night2:#25272D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#121316;--page-fg:#F2F3F5;--page-sub:#A4A8AE;--page-card:#1D1F24;--page-line:rgba(255,255,255,.14);color-scheme:dark}}
:root[data-theme="dark"]{--page:#121316;--page-fg:#F2F3F5;--page-sub:#A4A8AE;--page-card:#1D1F24;--page-line:rgba(255,255,255,.14);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--page);color:var(--page-fg);font-family:'Asta Sans','Noto Sans KR','Malgun Gothic',sans-serif;word-break:keep-all;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 56px}
.wrap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1.page{font-size:30px;line-height:38px;margin:0;font-weight:800;text-wrap:balance}
.lead{margin:6px 0 0;font-size:16px;line-height:24px;color:var(--page-sub);max-width:70ch}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{height:44px;padding:0 18px;border-radius:14px;border:1px solid var(--page-line);background:transparent;color:var(--page-fg);font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--page-fg);color:var(--page);border-color:transparent}
.diff{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.diff>div{background:var(--page-card);border-radius:18px;padding:16px 18px;min-width:0}
.diff h2{margin:0 0 6px;font-size:18px;line-height:26px}
.diff p{margin:0;font-size:15px;line-height:23px;color:var(--page-sub)}
.row-lab{font-size:15px;font-weight:700;margin:10px 0 8px}
.rowx{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.cell{display:flex;flex-direction:column;gap:6px;min-width:0}
.cell small{font-size:13px;line-height:18px;color:var(--page-sub)}
.jump{display:flex;flex-wrap:wrap;gap:6px}
.jump button{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--page-line);background:transparent;color:var(--page-fg);font:inherit;font-size:13px;cursor:pointer}
.jump button[aria-pressed=true]{background:var(--page-fg);color:var(--page)}
.note{font-size:14px;line-height:22px;color:var(--page-sub);margin:0;max-width:90ch}
.dev{position:relative;flex:none;max-width:100%}
.scr{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;color:var(--ink);font-family:inherit;font-feature-settings:"tnum"}
.phone{width:412px;height:915px;border-radius:40px;background:var(--bg);box-shadow:0 0 0 1px rgba(19,20,23,.16)}
.car{width:2554px;height:1208px;background:#fff;border-radius:16px;box-shadow:0 0 0 1px rgba(19,20,23,.16)}
.static .scr{pointer-events:none}
button{cursor:pointer}
.scr button{font-family:inherit;border:none;transition:transform .15s cubic-bezier(.16,1,.3,1)}
.scr button:active,.tap:active{transform:scale(.95)}
.scr :focus-visible,.tabs :focus-visible,.jump :focus-visible{outline:3px solid #0064FF;outline-offset:2px}
.a{position:absolute}
.fx{display:flex;align-items:center}
.sb{justify-content:space-between}
.col{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}
svg.ic{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.8;flex:none}
/* 휴대폰 공통 */
.st{height:32px;padding:10px 24px 0;font-size:13px;display:flex;justify-content:space-between;color:var(--ter);flex:none}
.gb{position:absolute;left:141px;bottom:8px;width:130px;height:5px;border-radius:3px;background:rgba(19,20,23,.3)}
.hd{height:56px;padding:0 16px 0 20px;display:flex;align-items:center;justify-content:space-between;flex:none}
.logo{font-size:21px;font-weight:800;letter-spacing:-.3px}
.icb{width:44px;height:44px;border-radius:14px;background:var(--basic);display:grid;place-items:center;color:var(--ink);padding:0}
.btn{height:56px;border-radius:16px;font-size:17px;font-weight:700;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px}
.pri{background:var(--filled);color:#fff}.secd{background:var(--basic);color:var(--ink)}.red{background:var(--red);color:#fff}.wht{background:#E0E1E6;color:var(--ink)}.glass{background:rgba(255,255,255,.12);color:#fff}
.cd{background:var(--card);border-radius:24px;box-shadow:0 6px 24px rgba(19,20,23,.08)}
.h24{font-size:24px;line-height:32px;font-weight:800}.h30{font-size:30px;line-height:38px;font-weight:800;letter-spacing:-.4px}
.t18{font-size:18px;line-height:26px;font-weight:700}.b16{font-size:16px;line-height:24px;color:var(--sec)}.b15{font-size:15px;line-height:22px;color:var(--sec)}.c13{font-size:13px;line-height:18px;color:var(--ter)}.c14{font-size:14px;line-height:20px;color:var(--ter)}
.chip{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:9px;background:var(--basic);font-size:13px;color:var(--sec);white-space:nowrap}
.onnight .chip{background:rgba(255,255,255,.12);color:#D7D9DF}
.onnight{color:#fff}.onnight .c14,.onnight .c13{color:#A4A8AE}.onnight .b16,.onnight .b15{color:#C7C9CE}
.past{height:76px;display:flex;align-items:center;gap:12px;padding:0 14px;text-align:left;background:var(--card);border-radius:20px;width:100%;color:var(--ink);box-shadow:0 2px 10px rgba(19,20,23,.05)}
.dock{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 26px;background:rgba(247,248,250,.86);backdrop-filter:blur(18px);display:flex;flex-direction:column;gap:8px}
.contact{background:var(--card);border-radius:18px;padding:12px 14px;min-width:0;text-align:left;box-shadow:0 2px 10px rgba(19,20,23,.05)}
.log{display:grid;grid-template-columns:62px 1fr;column-gap:10px;font-size:15px;line-height:22px;padding:6px 0}
.log span:first-child{color:var(--ter);font-size:13px;line-height:22px}
.new{animation:rise .6s cubic-bezier(.16,1,.3,1) both}
.seg{display:flex;gap:4px;padding:4px;background:var(--basic);border-radius:14px}
.seg button{flex:1;height:44px;border-radius:11px;background:transparent;color:var(--ter);font-size:16px;font-weight:700}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(19,20,23,.1)}
.toc{height:48px;display:flex;align-items:center;gap:10px;font-size:16px;width:100%;background:transparent;color:var(--ink);padding:0;text-align:left}
.sw{width:46px;height:28px;border-radius:14px;background:rgba(19,20,23,.16);position:relative;transition:background .2s;flex:none}
.sw i{position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:11px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .25s cubic-bezier(.16,1,.3,1)}
.sw.on{background:var(--filled)}.sw.on i{left:21px}
.pick{height:44px;padding:0 14px;border-radius:13px;background:var(--basic);color:var(--ink);font-size:15px;font-weight:700;white-space:nowrap}
.pick[aria-pressed=true]{background:var(--filled);color:#fff}
.tog{height:40px;padding:0 12px;border-radius:12px;background:transparent;box-shadow:inset 0 0 0 1.5px rgba(19,20,23,.16);color:var(--ter);font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.tog[aria-pressed=true]{background:rgba(68,70,78,.12);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--filled)}
.tog:disabled{cursor:default}
.sheetb{position:absolute;inset:0;background:rgba(19,20,23,.42);animation:fade .25s both}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:28px 28px 0 0;padding:24px 20px 34px;animation:up .35s cubic-bezier(.16,1,.3,1) both;display:flex;flex-direction:column;gap:10px}
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:var(--night);color:#fff;border-radius:16px;padding:14px 16px;font-size:15px;line-height:22px;animation:up .3s cubic-bezier(.16,1,.3,1) both}
.pg{background:#fff;color:#131417;box-shadow:0 2px 14px rgba(19,20,23,.16);border-radius:6px;overflow:hidden;position:relative}
.pgin{width:560px;height:792px;transform-origin:0 0;padding:44px 40px;font-size:18px;line-height:26px}
.pgin h3{margin:0 0 4px;font-size:30px;line-height:38px}.pgin h4{margin:22px 0 8px;font-size:19px;line-height:26px}
.pgin table{width:100%;border-collapse:collapse}.pgin td{border-top:1px solid rgba(19,20,23,.12);padding:7px 0;font-size:17px;line-height:24px}.pgin td:first-child{color:#686A72;width:34%}
/* 차 공통 */
.left{position:absolute;left:0;top:0;width:854px;height:1208px}
.win{position:absolute;left:854px;top:0;width:1700px;height:1208px;background:linear-gradient(#FFF 0,#FFF 190px,#F1F1F1 290px,#EEE 1028px);overflow:hidden}
.floor{position:absolute;left:0;top:1030px;width:1700px;height:178px;background:#fff;border-top:2px solid #E0E0E0}
.cb{height:100px;border-radius:32px;font-size:32px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:14px;padding:0 36px;white-space:nowrap}
.cicb{width:100px;height:100px;border-radius:32px;background:var(--basic);display:grid;place-items:center;padding:0;color:var(--ink)}
.h60{font-size:60px;line-height:80px;font-weight:800;margin:0;letter-spacing:-.6px}.h44{font-size:44px;line-height:58px;font-weight:800;margin:0}
.b30{font-size:30px;line-height:40px;color:var(--sec)}.b26{font-size:26px;line-height:36px;color:var(--ter)}
.ccd{background:#fff;border-radius:48px;box-shadow:0 12px 40px rgba(19,20,23,.08);color:var(--ink);padding:0;text-align:left}
.cchip{display:inline-flex;gap:8px;align-items:center;height:52px;padding:0 20px;border-radius:16px;background:var(--basic);font-size:26px;color:var(--sec);white-space:nowrap}
.onnight .cchip{background:rgba(255,255,255,.12);color:#D7D9DF}
.recbar{position:absolute;left:0;bottom:0;height:5px;background:var(--ink);animation:fill 10s linear both}
.reclab{position:absolute;right:48px;bottom:30px;font-size:26px;line-height:34px;color:var(--ter);display:flex;align-items:center;gap:10px}
.dot{width:14px;height:14px;border-radius:7px;background:var(--red);animation:blink 1.2s ease-in-out infinite}
.ctoast{position:absolute;left:80px;right:80px;bottom:190px;background:var(--night);color:#fff;border-radius:28px;padding:30px 36px;font-size:30px;line-height:40px;display:flex;align-items:center;justify-content:space-between;gap:30px;animation:up .3s cubic-bezier(.16,1,.3,1) both}
.hit{animation:hit .9s cubic-bezier(.16,1,.3,1) both}
.carin{animation:rise .7s cubic-bezier(.16,1,.3,1) both}
@keyframes hit{0%{opacity:0;transform:translateY(22px) scale(1.3)}60%{opacity:1;transform:none}75%{transform:translateY(-3px)}100%{transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fill{from{width:0}to{width:100%}}
@keyframes blink{50%{opacity:.25}}
::view-transition-group(*){animation-duration:.42s;animation-timing-function:cubic-bezier(.16,1,.3,1)}
@media (prefers-reduced-motion:reduce){*,::view-transition-group(*){animation:none!important;transition:none!important}}
.static *{animation:none!important}
.static .recbar{width:70%}
</style>

<div class="wrap">
  <header>
    <h1 class="page">사고 뒤 화면 시안</h1>
    <p class="lead">정리한 기록을 누구에게 어떻게 보내는지까지 이어지는 흐름입니다. 2안 모두 스크롤 없이 한 화면에 들어가고, 글자 링크가 없습니다. 값과 이름은 전부 예시입니다.</p>
  </header>
  <nav class="tabs" id="tabs" aria-label="보기 고르기"></nav>
  <div id="main" class="col" style="gap:20px"></div>
</div>
